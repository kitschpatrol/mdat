packages:
  - '.'
overrides:
  deepmerge-ts: ^8.0.2
  normalize-package-data: ^9.0.0
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  esbuild: true
  oxc-resolver: true
  puppeteer: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lognow@0.8.2
  - metascope@0.12.0
  - remark-mdat@3.0.2
